name: Feature Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run nightly at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────
  # TOOL SYSTEM: read/write/edit/bash/grep/glob
  # ─────────────────────────────────────────────
  test-tools:
    name: Tool System
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tools-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Test all tool implementations
        run: |
          cargo test -p phazeai-core --test tool_tests
          cargo test -p phazeai-core --test bash_cancel
          cargo test -p phazeai-core --lib -- tools::

  # ─────────────────────────────────────────────
  # MCP SERVER: connect, list tools, call tools
  # ─────────────────────────────────────────────
  test-mcp-full:
    name: MCP Server Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mcp-full-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install MCP filesystem server (test target)
        # Pinned: 1.0.0 was published 2026-10-11; --before resolves its dependencies as of 2026-10-17
        run: |
          npm install --prefix "$RUNNER_TEMP/mcp-fs" --no-save --no-audit --no-fund \
            --ignore-scripts --before=2026-10-17 @modelcontextprotocol/server-filesystem@1.0.0
          test -x "$RUNNER_TEMP/mcp-fs/node_modules/.bin/mcp-server-filesystem"
      - name: Run MCP bridge tests against the real server
        env:
          PHAZEAI_MCP_FS_SERVER: ${{ runner.temp }}/mcp-fs/node_modules/.bin/mcp-server-filesystem
        run: |
          cargo test -p phazeai-core --lib -- mcp
          # No name filter: every test in the target runs, so a new one cannot be left out.
          # The count only catches a target that no longer holds its two real-server tests.
          test "$(cargo test -p phazeai-core --test mcp_server_integration -- \
            --include-ignored --list | grep -c ': test$')" -ge 2
          # --include-ignored, not --ignored: still runs a test if its #[ignore] is ever removed
          cargo test -p phazeai-core --test mcp_server_integration -- --include-ignored

  # ─────────────────────────────────────────────
  # LSP: manager, watchdog, real rust-analyzer
  # ─────────────────────────────────────────────
  test-lsp:
    name: LSP Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lsp-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install rust-analyzer
        # The component for the toolchain rust-toolchain.toml pins; --version fails if it cannot run
        run: |
          rustup component add rust-analyzer --toolchain 1.93
          rust-analyzer --version
      - name: Run LSP tests
        run: |
          cargo test -p phazeai-core --lib -- lsp::
          cargo test -p phazeai-core --test lsp_watchdog_integration
          # --include-ignored, not --ignored: still runs the test if its #[ignore] is ever removed
          cargo test -p phazeai-core --test lsp_real_server_cycle -- --include-ignored

  # ─────────────────────────────────────────────
  # CONTEXT ENGINE: history, compaction, repo map
  # ─────────────────────────────────────────────
  test-context:
    name: Context Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-context-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Test context system
        run: |
          cargo test -p phazeai-core --lib -- context:: project::workspace
          # Only these editor_tests call phazeai_core; the rest test local copies of editor logic
          cargo test -p phazeai-core --test editor_tests -- outline_ repo_map_

  # ─────────────────────────────────────────────
  # PROVIDER REGISTRY: config, routing, defaults
  # ─────────────────────────────────────────────
  test-providers:
    name: LLM Provider Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-providers-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Test provider system (no API keys needed)
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          cargo test -p phazeai-core --lib -- llm::
          cargo test -p phazeai-core --test core_tests -- provider
          cargo test -p phazeai-core --test sprint3_verification -- model_router task_classification

  # Eval Harness (dry run) was removed: there is no eval feature, so it could only ever pass.

  # ─────────────────────────────────────────────
  # SETTINGS PERSISTENCE: read/write config files
  # ─────────────────────────────────────────────
  test-settings:
    name: Settings Persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-settings-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-render0-dev libxkbcommon-x11-dev \
            libudev-dev libinput-dev libdbus-1-dev pkg-config
      - name: Test settings persistence (config.toml, theme files)
        # session.toml (SessionState in app.rs) has no test that calls the production code yet
        run: |
          # Settings::save and Settings::load on a config directory in a temp dir
          cargo test -p phazeai-core --test settings_persistence
          cargo test -p phazeai-core --lib -- config::
          cargo test -p phazeai-core --test core_tests -- test_settings_
          cargo test -p phazeai-ui --lib -- panels::settings:: custom_theme::

  # ─────────────────────────────────────────────
  # STRESS TEST: agent loop, context pressure
  # ─────────────────────────────────────────────
  test-stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-stress-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Run stress tests
        run: cargo test -p phazeai-core --test stress_test -- --nocapture
