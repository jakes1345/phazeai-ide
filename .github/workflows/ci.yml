name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────
  # 1. FORMAT CHECK (fast fail)
  # ─────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ─────────────────────────────────────────────
  # 2. CLIPPY LINTS
  # ─────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-render0-dev libxkbcommon-x11-dev \
            libudev-dev libinput-dev libdbus-1-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ─────────────────────────────────────────────
  # 3. SECURITY AUDIT
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet
      - name: Run security audit
        # Fail on real vulnerabilities only. 'Unmaintained'/'unsound' notices (mostly
        # transitive through floem/winit) are still printed in this log, not hidden or
        # allow-listed; revisit them when the GUI dependencies move.
        run: cargo audit

  # ─────────────────────────────────────────────
  # 4. CORE ENGINE TESTS
  # ─────────────────────────────────────────────
  test-core:
    name: Test / phazeai-core
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-core-
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Test phazeai-core
        run: cargo test -p phazeai-core --all-features
      - name: Build ollama-rs (tests need live Ollama, skip in CI)
        run: cargo build -p ollama-rs-phazeai

  # ─────────────────────────────────────────────
  # 5. CLI TESTS
  # ─────────────────────────────────────────────
  test-cli:
    name: Test / phazeai-cli
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cli-
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Test phazeai-cli
        run: cargo test -p phazeai-cli
      - name: Build CLI binary
        run: cargo build -p phazeai-cli
      - name: Smoke test CLI
        run: |
          ./target/debug/phazeai --help
          ./target/debug/phazeai --version

  # ─────────────────────────────────────────────
  # 6. UI STATE TESTS (headless — no GPU needed)
  # ─────────────────────────────────────────────
  test-ui:
    name: Test / phazeai-ui
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ui-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ui-
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-render0-dev libxkbcommon-x11-dev \
            libudev-dev libinput-dev libdbus-1-dev \
            xvfb xdotool scrot imagemagick fluxbox \
            mesa-vulkan-drivers libgl1-mesa-dri
      - name: Test phazeai-ui (state + integration)
        run: cargo test -p phazeai-ui
      - name: Test phazeai-ui tier2 (xvfb screenshot tests)
        timeout-minutes: 15
        run: xvfb-run -a cargo test -p phazeai-ui --test tier2_integration -- --ignored --test-threads=1
      - name: Keep GUI test evidence on failure
        if: failure()
        run: |
          mkdir -p tier2-evidence
          cp crates/phazeai-ui/tests/snapshots/*.png tier2-evidence/ 2>/dev/null || true
          cp /tmp/phazeai-tier2-harness.log tier2-evidence/ 2>/dev/null || true
          for d in /tmp/phazeai-ui-tier2-home-*; do
            [ -f "$d/ide.log" ] && cp "$d/ide.log" "tier2-evidence/$(basename "$d").log"
          done
          ls -la tier2-evidence
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tier2-evidence
          path: tier2-evidence/
          if-no-files-found: ignore
      - name: Build UI binary
        run: cargo build -p phazeai-ui

  # ─────────────────────────────────────────────
  # 7. AGENT / LLM MOCK TESTS
  # ─────────────────────────────────────────────
  test-agent:
    name: Test / Agent Loop (mock)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-agent-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-agent-
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Run agent + tool tests
        env:
          # No real API key — only mock/unit tests run
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          cargo test -p phazeai-core -- \
            approval \
            tool \
            command \
            agent \
            mcp \
            repo_map \
            context \
            persistence \
            workspace \
            outline \
            linter \
            --test-threads=4

  # ─────────────────────────────────────────────
  # 8. GIT INTEGRATION TESTS
  # ─────────────────────────────────────────────
  test-git:
    name: Test / Git Integration
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-git-
      - name: Configure git
        run: |
          git config --global user.email "ci@phazeai.dev"
          git config --global user.name "PhazeAI CI"
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Run git tests
        run: cargo test -p phazeai-core --test git_tests

  # ─────────────────────────────────────────────
  # 9. MCP SERVER CONNECTIVITY TEST
  # ─────────────────────────────────────────────
  test-mcp:
    name: Test / MCP Bridge
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-mcp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-mcp-
      - name: Install Node.js (for MCP server)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Run MCP bridge tests
        run: cargo test -p phazeai-core -- mcp --test-threads=1

  test-plugin-api:
    name: Test / phazeai-plugin-api
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-plugin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-plugin-
      - name: Test phazeai-plugin-api
        run: cargo test -p phazeai-plugin-api

  # ─────────────────────────────────────────────
  build-gate:
    name: Build Gate (all crates)
    runs-on: ubuntu-latest
    needs: [ test-core, test-cli, test-ui, test-agent, test-git, test-mcp, clippy, test-plugin-api ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-full-
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-render0-dev libxkbcommon-x11-dev \
            libudev-dev libinput-dev libdbus-1-dev
      - name: Build all crates
        run: cargo build --workspace
      - name: Verify binaries exist
        run: |
          ls -lh target/debug/phazeai
          ls -lh target/debug/phazeai-ui
      - name: Run full test suite
        run: cargo test --workspace
