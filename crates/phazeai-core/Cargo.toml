[package]
name = "phazeai-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core engine for PhazeAI IDE - agent loop, LLM clients, tools, config"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
similar = { workspace = true }
notify = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = "5.0"
toml = "0.8"
ollama-rs = { workspace = true }
comrak = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = "0.25"
tree-sitter-highlight = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-html = { workspace = true }
tree-sitter-css = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-bash = { workspace = true }
lsp-types = { workspace = true }
urlencoding = "2.1"
libloading = "0.8"
phazeai-plugin-api = { path = "../phazeai-plugin-api", version = "0.1.0" }
zip = "2"
plist = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
streaming-iterator = "0.1.9"

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true, features = ["test-util", "macros"] }

